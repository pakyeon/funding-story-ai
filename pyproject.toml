[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "funding-story-ai"
version = "0.1.0"
description = "Fact-aware AI pipeline for reviewable crowdfunding stories"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastmcp[tasks]>=3,<4",
  "google-genai>=1.31,<2",
  "jsonschema>=4.23,<5",
  "langgraph>=1.2.11",
  "openai>=2,<3",
  "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
funding-story = "funding_story_ai.cli:main"
funding-story-mcp-server = "funding_story_ai.mcp_server:main"
funding-story-submit = "funding_story_ai.mcp_client_cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.packages.find]
where = ["src"]
